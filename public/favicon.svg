<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <title>Harmonic Bench</title>
  <style>
    /* 暗いタブバーでは濃紺の背景が溶けるので、ダークモードのときだけ薄い縁取りを付ける */
    .edge { display: none; }
    @media (prefers-color-scheme: dark) {
      .edge { display: inline; }
    }
  </style>
  <rect width="32" height="32" rx="6" fill="#1f2a44"/>
  <rect class="edge" x="0.75" y="0.75" width="30.5" height="30.5" rx="5.25" fill="none" stroke="#9aa6c4" stroke-width="1.5"/>
  <rect x="5" y="7" width="6" height="18" rx="1" fill="#fff"/>
  <rect x="13" y="7" width="6" height="18" rx="1" fill="#fff"/>
  <rect x="21" y="7" width="6" height="18" rx="1" fill="#f2b84b"/>
  <rect x="9" y="7" width="4" height="11" rx="1" fill="#1f2a44"/>
  <rect x="19" y="7" width="4" height="11" rx="1" fill="#1f2a44"/>
</svg>
